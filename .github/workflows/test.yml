name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: brew install shellcheck

      - name: ShellCheck
        run: shellcheck claude-fix make_claude_launchers.sh tests/run_tests.sh tests/lib/harness.sh

      - name: Parse with macOS's own bash 3.2
        run: |
          /bin/bash --version | head -1
          /bin/bash -n claude-fix
          /bin/bash -n make_claude_launchers.sh
          /bin/bash -n tests/run_tests.sh
          /bin/bash -n tests/lib/harness.sh

      - name: Check the generated runtime helper
        run: |
          tmp=$(mktemp -d)
          /bin/bash -c 'source ./claude-fix; write_runtime_helper "$1"' _ "$tmp"
          /bin/bash -n "$tmp/claude-fix.sh"
          shellcheck "$tmp/claude-fix.sh"
          osacompile -l JavaScript -o "$tmp/focus.scpt" "$tmp/focus.js"
          osacompile -l JavaScript -o "$tmp/claim.scpt" "$tmp/claim.js"

      - name: Build the Dock watcher
        run: |
          tmp=$(mktemp -d)
          /bin/bash -c 'source ./claude-fix; watcher_source' >"$tmp/watch.swift"
          swiftc -O -o "$tmp/claude-fix-watch" "$tmp/watch.swift"
          test -x "$tmp/claude-fix-watch"

      - name: Check the icon tool
        run: |
          tmp=$(mktemp -d)
          cp icons/generate_icons.swift icons/glyphs.json "$tmp/"
          swiftc -O -o "$tmp/generate_icons" "$tmp/generate_icons.swift"
          # Flat fallback icons
          (cd "$tmp" && ./generate_icons)
          for name in profile-0 profile-7 home code star heart book globe bolt leaf moon chat; do
            test -s "$tmp/$name.icns"
          done
          # Recolored app icon with each kind of badge (CI has no Claude, so use Calculator)
          app=/System/Applications/Calculator.app
          "$tmp/generate_icons" --app "$app" --symbol work --output "$tmp/work.icns" --assets-car "$tmp/Assets.car"
          "$tmp/generate_icons" --app "$app" --letter C --color "#3366ff" --output "$tmp/letter.icns"
          "$tmp/generate_icons" --app "$app" --no-badge --color teal --output "$tmp/plain.icns"
          test -s "$tmp/work.icns" && test -s "$tmp/letter.icns" && test -s "$tmp/plain.icns"
          if [ -f "$tmp/Assets.car" ]; then
            echo "Layered icon built with $(xcodebuild -version | head -1):"
            assetutil --info "$tmp/Assets.car" | grep -E '"(Name|Appearance|AssetType)"' | sort | uniq -c || true
          else
            echo "Layered icon skipped: this runner has no Xcode 26 actool"
          fi
          mkdir -p icon-previews
          for name in work letter plain; do
            sips -s format png "$tmp/$name.icns" --out "icon-previews/$name.png" >/dev/null
          done

      - name: Upload icon previews
        uses: actions/upload-artifact@v4
        with:
          name: icon-previews
          path: icon-previews

      - name: Run test suite with macOS's bash 3.2
        run: /bin/bash tests/run_tests.sh
