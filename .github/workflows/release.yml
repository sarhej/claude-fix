name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the script version
        run: |
          version=$(sed -n 's/^CLAUDE_FIX_VERSION="\(.*\)"$/\1/p' claude-fix)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CLAUDE_FIX_VERSION=$version"
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.tar.gz"
          sha=$(curl -fsSL "$url" | shasum -a 256 | awk '{print $1}')
          {
            echo "Homebrew formula (sarhej/homebrew-claude-fix):"
            echo
            echo '```ruby'
            echo "  url \"$url\""
            echo "  sha256 \"$sha\""
            echo '```'
          } >formula.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --notes-file formula.md
          cat formula.md >>"$GITHUB_STEP_SUMMARY"
